execution:
  max_output_bytes: 10485760
  shell: auto
  timeout_seconds: 120
logging:
  directory: .sentinelbox/logs
  max_file_size_mb: 50
network:
  mode: deny
policy:
  allowed_commands:
  - python
  - python3
  - pytest
  - ruff
  - mypy
  - git
  - npm
  default_action: deny
  denied_commands:
  - shutdown
  - reboot
  - format
  - mkfs
  - sudo
sandbox:
  hash_mode: BALANCED
  mode: isolated
  preserve_git: true
verification:
  commands:
  - python -m compileall .
  - pytest
  fail_fast: true
